services:
  couchdb:
    image: couchdb:3.5
    container_name: obsidian-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_ADMIN_USER}
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
    # The image's entrypoint chowns everything under /opt/couchdb and exits
    # silently if that fails, which it does on a read-only bind mount. So mount
    # local.ini outside /opt/couchdb and copy it in on every start.
    entrypoint:
      - sh
      - -c
      - cp /config/10-livesync.ini /opt/couchdb/etc/local.d/ && exec tini -- /docker-entrypoint.sh "$$@"
      - sh
    command: ["/opt/couchdb/bin/couchdb"]
    volumes:
      # Point DATA_DIR at the SSD, not the SD card
      - ${DATA_DIR:-./data}:/opt/couchdb/data
      - ./local.ini:/config/10-livesync.ini:ro
    ports:
      # Localhost only. Tailscale serve handles HTTPS + remote access.
      - "127.0.0.1:5984:5984"
    healthcheck:
      # require_valid_user also covers /_up, so authenticate
      test: ["CMD-SHELL", "curl -fs -u \"$$COUCHDB_USER:$$COUCHDB_PASSWORD\" http://localhost:5984/_up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
